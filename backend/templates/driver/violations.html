<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An toàn, Vi phạm & Khiếu nại — V4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <script src="/static/js/ui-kit.js"></script>
</head>
<body class="v4-body min-h-screen pb-[96px]">

<div class="max-w-md mx-auto px-4 py-5">
    <div class="flex items-center justify-between mb-5">
        <div>
            <h1 class="text-2xl font-extrabold tracking-tight">An toàn & Khiếu nại</h1>
            <p class="text-slate-400 text-xs mt-0.5">Tách bạch cảnh báo AI với vi phạm đã xác minh</p>
        </div>
        <a href="/driver/notifications" aria-label="Thông báo" class="w-11 h-11 rounded-2xl v4-surface flex items-center justify-center text-slate-200">
            <span class="material-icons-round text-xl">notifications_none</span>
        </a>
    </div>

    <!-- SEGMENTED CONTROL 3 TAB -->
    <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl v4-surface mb-4">
        <button onclick="switchTab('violations')" id="tab-violations" class="tab-btn py-2.5 rounded-xl bg-sky-500 text-slate-950 text-xs font-extrabold">Vi phạm</button>
        <button onclick="switchTab('appeals')" id="tab-appeals" class="tab-btn py-2.5 rounded-xl text-slate-400 text-xs font-semibold">Khiếu nại</button>
        <button onclick="switchTab('ai')" id="tab-ai" class="tab-btn py-2.5 rounded-xl text-slate-400 text-xs font-semibold">Cảnh báo AI</button>
    </div>

    <div id="aiInfoBanner" class="hidden mb-4 p-3 rounded-xl bg-sky-500/10 border border-sky-500/25 text-sky-200 text-xs leading-relaxed">
        Các ghi nhận tự động từ AI chỉ hỗ trợ an toàn — chưa được tính là vi phạm chính thức.
    </div>

    <div id="contentList" class="space-y-3"></div>
</div>

<!-- 4-TAB FLOATING BOTTOM NAV (V4.0) -->
<nav class="fixed bottom-0 left-0 right-0 v4-glass border-t border-white/10 py-2.5 z-40">
    <div class="w-full max-w-md mx-auto grid grid-cols-4 text-[11px] font-semibold">
        <a href="/driver/dashboard" class="flex flex-col items-center gap-0.5 text-slate-400">
            <span class="material-icons-round text-2xl">speed</span><span>Cabin</span>
        </a>
        <a href="/driver/schedules" class="flex flex-col items-center gap-0.5 text-slate-400">
            <span class="material-icons-round text-2xl">calendar_today</span><span>Lịch trình</span>
        </a>
        <a href="/driver/violations" class="flex flex-col items-center gap-0.5 text-sky-400 font-bold">
            <span class="material-icons-round text-2xl">verified_user</span><span>An toàn</span>
        </a>
        <a href="/driver/profile" class="flex flex-col items-center gap-0.5 text-slate-400">
            <span class="material-icons-round text-2xl">account_circle</span><span>Cá nhân</span>
        </a>
    </div>
</nav>

<script>
let currentTab = "violations";

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => {
        b.className = "tab-btn py-2.5 rounded-xl text-slate-400 text-xs font-semibold";
    });
    document.getElementById("tab-" + tab).className = "tab-btn py-2.5 rounded-xl bg-sky-500 text-slate-950 text-xs font-extrabold";
    document.getElementById("aiInfoBanner").classList.toggle("hidden", tab !== "ai");
    loadTab();
}

async function loadTab() {
    const box = document.getElementById("contentList");
    box.innerHTML = UI.skeletonRows(3);

    if (currentTab === "violations") {
        const j = await fetch("/api/driver/violations").then(r => r.json()).catch(() => ({ success: false }));
        if (!j.success || !j.data.length) {
            box.innerHTML = `<div class="p-8 rounded-2xl v4-surface text-center text-slate-400 text-sm">Tuyệt vời! Bạn không có vi phạm nào đã xác minh.</div>`;
            return;
        }
        box.innerHTML = j.data.map(vp => {
            const canAppeal = vp.can_appeal !== undefined ? Boolean(vp.can_appeal) : ["HIEU_LUC", "GIU_NGUYEN"].includes(vp.trang_thai);
            return `
                <div class="p-4 rounded-2xl v4-surface space-y-2.5">
                    <div class="flex justify-between items-center gap-2">
                        <span class="font-bold text-sm text-rose-300">${UI.escHtml(vp.loai_vi_pham)} • #${vp.id}</span>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-amber-500/15 text-amber-300">${UI.escHtml(vp.trang_thai)}</span>
                    </div>
                    <div class="p-3 rounded-xl bg-[#090d16] border-l-4 border-sky-500 text-xs text-slate-200">
                        <p class="text-[10px] text-slate-400 font-bold mb-0.5">Nhận xét của Quản lý:</p>
                        ${UI.escHtml(vp.ly_do_xac_minh)}
                    </div>
                    ${vp.image_url ? `<img src="${UI.escHtml(vp.image_url)}" onclick="UI.openLightbox('${UI.escHtml(vp.image_url)}', 'Bằng chứng Vi phạm #${vp.id}')" class="w-full h-40 object-cover rounded-xl border border-white/10 cursor-zoom-in" />` : ""}
                    <p class="text-[11px] text-slate-500 tabular-nums">Xác minh lúc: ${UI.escHtml(vp.xac_minh_at || "")}</p>
                    ${canAppeal
                        ? `<button onclick="openAppealDrawer(${vp.id})" class="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-xs font-bold">Gửi giải trình / Khiếu nại</button>`
                        : (vp.appeal_block_reason ? `<p class="text-[11px] text-slate-500 italic">${UI.escHtml(vp.appeal_block_reason)}</p>` : "")}
                </div>
            `;
        }).join("");
    } else if (currentTab === "appeals") {
        const j = await fetch("/api/driver/appeals").then(r => r.json()).catch(() => ({ success: false }));
        if (!j.success || !j.data.length) {
            box.innerHTML = `<div class="p-8 rounded-2xl v4-surface text-center text-slate-400 text-sm">Bạn chưa gửi phiếu khiếu nại nào.</div>`;
            return;
        }
        box.innerHTML = j.data.map(kn => {
            const st = kn.trang_thai || "SUBMITTED";
            const s2 = ["UNDER_REVIEW", "NEED_MORE_INFO", "ACCEPTED", "REJECTED", "CLOSED"].includes(st);
            const s3 = ["ACCEPTED", "REJECTED", "CLOSED"].includes(st);
            return `
                <div class="p-4 rounded-2xl v4-surface space-y-2.5">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm">Khiếu nại #${kn.id} (VP #${kn.vi_pham_id})</span>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-sky-500/15 text-sky-300">${UI.escHtml(st)}</span>
                    </div>
                    <div class="flex items-center justify-between px-3 text-[10px] font-bold">
                        <span class="text-sky-400">● Đã gửi</span>
                        <span class="flex-1 h-px bg-white/10 mx-2"></span>
                        <span class="${s2 ? "text-sky-400" : "text-slate-500"}">● Xem xét</span>
                        <span class="flex-1 h-px bg-white/10 mx-2"></span>
                        <span class="${s3 ? (st === "ACCEPTED" ? "text-emerald-400" : "text-amber-400") : "text-slate-500"}">● Kết luận</span>
                    </div>
                    <div class="p-3 rounded-xl bg-[#090d16] border-l-4 border-sky-500 text-xs text-slate-200">
                        <p class="text-[10px] text-slate-400 font-bold mb-0.5">🔒 Giải trình gốc (bất biến):</p>
                        ${UI.escHtml(kn.noi_dung_giai_trinh)}
                    </div>
                    ${kn.ly_do_ket_luan ? `<p class="text-xs font-semibold ${st === "ACCEPTED" ? "text-emerald-400" : "text-amber-300"}">Kết luận QL: ${UI.escHtml(kn.ly_do_ket_luan)}</p>` : ""}
                </div>
            `;
        }).join("");
    } else {
        const j = await fetch("/api/driver/ai-events").then(r => r.json()).catch(() => ({ success: false }));
        if (!j.success || !j.data.length) {
            box.innerHTML = `<div class="p-8 rounded-2xl v4-surface text-center text-slate-400 text-sm">Chưa có cảnh báo AI nào.</div>`;
            return;
        }
        box.innerHTML = j.data.map(ev => {
            const risk = Math.min(10, Math.max(0, Number(ev.risk_score || 0)));
            return `
                <div class="p-4 rounded-2xl v4-surface space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-sky-300">${UI.escHtml(ev.loai_canh_bao)}</span>
                        <span class="text-xs font-extrabold text-amber-400 tabular-nums">Risk ${risk}/10</span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-[#090d16] overflow-hidden">
                        <div class="h-1.5 rounded-full ${risk >= 7 ? "bg-rose-500" : "bg-amber-400"}" style="width:${risk * 10}%"></div>
                    </div>
                    <p class="text-xs text-slate-300">${UI.escHtml(ev.noi_dung || "")}</p>
                    <p class="text-[11px] text-slate-500 tabular-nums">${UI.escHtml(ev.trang_thai)} • ${UI.escHtml(ev.thoi_gian_xay_ra || "")}</p>
                </div>
            `;
        }).join("");
    }
}

function openAppealDrawer(vpId) {
    UI.confirmAction({
        title: `Gửi khiếu nại Vi phạm #${vpId}`,
        subtitle: "🔒 Nội dung giải trình gốc được lưu bất biến trong hệ thống để Quản lý đối chiếu.",
        requireReason: true,
        reasonPlaceholder: "Trình bày rõ bối cảnh và lý do giải trình...",
        confirmLabel: "Gửi khiếu nại chính thức",
        onConfirm: async (reason) => {
            const j = await fetch(`/api/driver/violations/${vpId}/appeals`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ noi_dung_giai_trinh: reason, minh_chung_urls: [] }),
            }).then(r => r.json());
            UI.toast(j.message, j.success ? "success" : "error");
            if (j.success) switchTab("appeals");
        },
    });
}

loadTab();
</script>
</body>
</html>
