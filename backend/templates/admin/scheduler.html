<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý lịch chạy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<nav class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div>
                <h1 class="text-xl font-bold">DACN1 Admin</h1>
                <p class="text-sm text-slate-400">Hệ thống giám sát tài xế bằng AI</p>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-1">
                <a href="/admin/dashboard" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Dashboard</a>
                <a href="/admin/drivers" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Tài xế</a>
                <a href="/admin/vehicles" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Xe</a>
                <a href="/admin/scheduler" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Lịch chạy</a>
                <a href="/admin/reports" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Báo cáo</a>
                <a href="/admin/analytics" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Thống kê</a>
                <a href="/logout" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-sm whitespace-nowrap">Đăng xuất</a>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6">

    <div class="mb-6">
        <h1 class="text-3xl font-black">Quản lý lịch chạy</h1>
        <p class="text-slate-400 mt-1">Tạo, cập nhật và hủy lịch chạy cho tài xế</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">📅 Tổng lịch</p>
            <h2 id="totalSchedules" class="text-4xl font-black mt-2">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🟦 Sắp chạy</p>
            <h2 id="upcomingSchedules" class="text-4xl font-black mt-2 text-cyan-400">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🟢 Đang chạy</p>
            <h2 id="runningSchedules" class="text-4xl font-black mt-2 text-green-400">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🔴 Đã hủy</p>
            <h2 id="cancelSchedules" class="text-4xl font-black mt-2 text-red-400">0</h2>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- FORM -->
        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 h-fit shadow-xl">
            <div class="mb-5">
                <h2 class="text-xl font-bold">Tạo lịch chạy</h2>
                <p class="text-sm text-slate-400 mt-1">Phân công tài xế, xe và tuyến đường</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400 font-bold uppercase">Tài xế</label>
                    <select id="tai_xe_id"
                        class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"></select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-bold uppercase">Xe</label>
                    <select id="xe_id"
                        class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"></select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-bold uppercase">Tuyến đường</label>
                    <input id="tuyen_duong"
                        class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                        placeholder="VD: Đà Nẵng - Huế">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-bold uppercase">Giờ bắt đầu</label>
                    <input id="gio_bat_dau" type="datetime-local"
                        class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-bold uppercase">Giờ kết thúc dự kiến</label>
                    <input id="gio_ket_thuc" type="datetime-local"
                        class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500">
                </div>

                <button id="createBtn" onclick="createSchedule()"
                    class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] transition p-3 rounded-xl font-bold">
                    Tạo lịch chạy
                </button>
            </div>
        </section>

        <!-- LIST -->
        <section class="lg:col-span-2">
            <div class="mb-4">
                <input id="searchSchedule"
                    onkeyup="filterSchedules()"
                    placeholder="🔍 Tìm tuyến đường, tài xế, biển số..."
                    class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>

            <div id="schedules" class="space-y-4"></div>
        </section>

    </div>

</main>

<script>
const currentPath = window.location.pathname;

document.querySelectorAll(".admin-link").forEach(link => {
    if (link.getAttribute("href") === currentPath) {
        link.classList.remove("bg-slate-800");
        link.classList.add("bg-blue-600");
    }
});

let drivers = [];
let vehicles = [];

function toMysqlDateTime(value) {
    if (!value) return null;
    return value.replace("T", " ") + ":00";
}

function statusBadge(status) {
    if (status === "sap_chay") return "bg-cyan-500/20 text-cyan-300 border border-cyan-500/30";
    if (status === "dang_chay") return "bg-green-500/20 text-green-300 border border-green-500/30";
    if (status === "hoan_thanh") return "bg-slate-700 text-slate-300 border border-slate-600";
    if (status === "da_huy") return "bg-red-500/20 text-red-300 border border-red-500/30";
    return "bg-blue-500/20 text-blue-300 border border-blue-500/30";
}

function statusText(status) {
    if (status === "sap_chay") return "Sắp chạy";
    if (status === "dang_chay") return "Đang chạy";
    if (status === "hoan_thanh") return "Hoàn thành";
    if (status === "da_huy") return "Đã hủy";
    return status || "N/A";
}

function formatDateTime(value) {
    if (!value) return "";
    return String(value).replace("T", " ");
}

async function loadOptions() {
    const res = await fetch("/api/admin/schedules/options");
    const json = await res.json();

    drivers = json.drivers || [];
    vehicles = json.vehicles || [];

    const driverSelect = document.getElementById("tai_xe_id");
    const vehicleSelect = document.getElementById("xe_id");

    driverSelect.innerHTML = "";
    vehicleSelect.innerHTML = "";

    if (drivers.length === 0) {
        driverSelect.innerHTML = `<option value="">Không có tài xế</option>`;
    } else {
        drivers.forEach(d => {
            const ten = d.ho_ten || d.ten_tai_xe || d.name || d.ten_dang_nhap || "Tài xế";
            driverSelect.innerHTML += `<option value="${d.id}">${ten} - ID ${d.id}</option>`;
        });
    }

    if (vehicles.length === 0) {
        vehicleSelect.innerHTML = `<option value="">Không có xe</option>`;
    } else {
        vehicles.forEach(v => {
            vehicleSelect.innerHTML += `<option value="${v.id}">${v.bien_so || "Xe"} - ${v.model || ""}</option>`;
        });
    }
}

async function loadSchedules() {
    const res = await fetch("/api/admin/schedules");
    const json = await res.json();

    const data = json.data || [];
    const box = document.getElementById("schedules");

    document.getElementById("totalSchedules").innerText = data.length;
    document.getElementById("upcomingSchedules").innerText = data.filter(x => x.trang_thai === "sap_chay").length;
    document.getElementById("runningSchedules").innerText = data.filter(x => x.trang_thai === "dang_chay").length;
    document.getElementById("cancelSchedules").innerText = data.filter(x => x.trang_thai === "da_huy").length;

    box.innerHTML = "";

    if (data.length === 0) {
        box.innerHTML = `
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-slate-400">
                Chưa có lịch chạy.
            </div>
        `;
        return;
    }

    data.forEach(item => {
        box.innerHTML += `
            <div class="schedule-card bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl hover:border-blue-500/40 transition">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-5">
                    <div>
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-purple-600 flex items-center justify-center text-2xl">
                                📅
                            </div>
                            <div>
                                <h2 class="text-xl font-black">${item.tuyen_duong || "Chưa có tuyến"}</h2>
                                <p class="text-slate-400 text-sm">${item.ho_ten || "Chưa có tài xế"} - ${item.bien_so || "Chưa có xe"}</p>
                            </div>
                        </div>
                    </div>

                    <span class="px-3 py-1 rounded-full text-xs font-bold w-fit ${statusBadge(item.trang_thai)}">
                        ${statusText(item.trang_thai)}
                    </span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                    <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-4">
                        <p class="text-xs text-slate-400 uppercase font-bold">Bắt đầu</p>
                        <p class="font-bold mt-1">${formatDateTime(item.gio_bat_dau) || "Chưa có"}</p>
                    </div>

                    <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-4">
                        <p class="text-xs text-slate-400 uppercase font-bold">Kết thúc</p>
                        <p class="font-bold mt-1">${formatDateTime(item.gio_ket_thuc) || "Chưa có"}</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input id="route-${item.id}" value="${item.tuyen_duong || ""}"
                        class="p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                        placeholder="Tuyến đường">

                    <input id="start-${item.id}" value="${item.gio_bat_dau || ""}"
                        class="p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                        placeholder="Giờ bắt đầu">

                    <input id="end-${item.id}" value="${item.gio_ket_thuc || ""}"
                        class="p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                        placeholder="Giờ kết thúc">

                    <select id="status-${item.id}"
                        class="p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500">
                        <option value="sap_chay" ${item.trang_thai === "sap_chay" ? "selected" : ""}>Sắp chạy</option>
                        <option value="dang_chay" ${item.trang_thai === "dang_chay" ? "selected" : ""}>Đang chạy</option>
                        <option value="hoan_thanh" ${item.trang_thai === "hoan_thanh" ? "selected" : ""}>Hoàn thành</option>
                        <option value="da_huy" ${item.trang_thai === "da_huy" ? "selected" : ""}>Đã hủy</option>
                    </select>
                </div>

                <div class="flex gap-3 mt-4">
                    <button id="update-${item.id}" onclick="updateSchedule(${item.id}, ${item.tai_xe_id || 0}, ${item.xe_id || 0})"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold">
                        Cập nhật
                    </button>

                    <button onclick="deleteSchedule(${item.id})"
                        class="flex-1 bg-red-600 hover:bg-red-700 p-3 rounded-xl font-bold">
                        Hủy lịch
                    </button>
                </div>
            </div>
        `;
    });
}

async function createSchedule() {
    const btn = document.getElementById("createBtn");
    const taiXeId = Number(document.getElementById("tai_xe_id").value);
    const xeId = Number(document.getElementById("xe_id").value);
    const tuyenDuong = document.getElementById("tuyen_duong").value.trim();
    const gioBatDau = document.getElementById("gio_bat_dau").value;

    if (!taiXeId || !xeId || !tuyenDuong || !gioBatDau) {
        alert("Vui lòng nhập đủ tài xế, xe, tuyến đường và giờ bắt đầu.");
        return;
    }

    btn.innerText = "Đang tạo...";
    btn.disabled = true;
    btn.classList.add("opacity-70");

    try {
        const body = {
            tai_xe_id: taiXeId,
            xe_id: xeId,
            tuyen_duong: tuyenDuong,
            gio_bat_dau: toMysqlDateTime(gioBatDau),
            gio_ket_thuc: toMysqlDateTime(document.getElementById("gio_ket_thuc").value),
            quan_ly_id: 1
        };

        const res = await fetch("/api/admin/schedules", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });

        const json = await res.json();
        alert(json.message);

        if (json.success) {
            document.getElementById("tuyen_duong").value = "";
            document.getElementById("gio_bat_dau").value = "";
            document.getElementById("gio_ket_thuc").value = "";
        }

        loadSchedules();

    } catch (error) {
        alert("Không thể tạo lịch chạy.");
    } finally {
        btn.innerText = "Tạo lịch chạy";
        btn.disabled = false;
        btn.classList.remove("opacity-70");
    }
}

async function updateSchedule(id, taiXeId, xeId) {
    const btn = document.getElementById(`update-${id}`);
    btn.innerText = "Đang cập nhật...";
    btn.disabled = true;
    btn.classList.add("opacity-70");

    try {
        const body = {
            tai_xe_id: taiXeId,
            xe_id: xeId,
            tuyen_duong: document.getElementById(`route-${id}`).value,
            gio_bat_dau: document.getElementById(`start-${id}`).value,
            gio_ket_thuc: document.getElementById(`end-${id}`).value,
            trang_thai: document.getElementById(`status-${id}`).value,
            quan_ly_id: 1
        };

        const res = await fetch(`/api/admin/schedules/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });

        const json = await res.json();
        alert(json.message);
        loadSchedules();

    } catch (error) {
        alert("Không thể cập nhật lịch chạy.");
    } finally {
        btn.innerText = "Cập nhật";
        btn.disabled = false;
        btn.classList.remove("opacity-70");
    }
}

async function deleteSchedule(id) {
    if (!confirm("Bạn chắc chắn muốn hủy lịch này?")) return;

    const res = await fetch(`/api/admin/schedules/${id}`, {
        method: "DELETE",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({quan_ly_id: 1})
    });

    const json = await res.json();
    alert(json.message);
    loadSchedules();
}

function filterSchedules() {
    const keyword = document.getElementById("searchSchedule").value.toLowerCase();

    document.querySelectorAll(".schedule-card").forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(keyword) ? "block" : "none";
    });
}
async function initScheduler() {
    await loadOptions();
    await loadSchedules();
}

initScheduler();
</script>

</body>
</html>
