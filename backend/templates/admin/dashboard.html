<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen p-6">

<div class="max-w-7xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold">Admin Dashboard</h1>
            <p class="text-slate-400">Giám sát tài xế, xe và cảnh báo AI</p>
        </div>

        <div class="flex gap-3">
            <a href="/admin/reports" class="bg-blue-600 px-4 py-2 rounded-xl">
                Báo cáo sự cố
            </a>

            <a href="/login" class="bg-slate-800 px-4 py-2 rounded-xl">
                Đăng xuất
            </a>
        </div>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <p class="text-slate-400">Tài xế</p>
            <h2 id="tong_tai_xe" class="text-3xl font-bold mt-2">0</h2>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <p class="text-slate-400">Xe</p>
            <h2 id="tong_xe" class="text-3xl font-bold mt-2">0</h2>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <p class="text-slate-400">Xe đang hoạt động</p>
            <h2 id="xe_dang_hoat_dong" class="text-3xl font-bold mt-2 text-green-400">0</h2>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <p class="text-slate-400">Cảnh báo hôm nay</p>
            <h2 id="canh_bao_hom_nay" class="text-3xl font-bold mt-2 text-red-400">0</h2>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <p class="text-slate-400">Báo cáo chờ xử lý</p>
            <h2 id="bao_cao_chua_xu_ly" class="text-3xl font-bold mt-2 text-yellow-400">0</h2>
        </div>
    </div>

    <!-- LIVE MONITOR -->
    <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Xe đang hoạt động</h2>
            <span class="text-sm text-slate-400">Auto refresh 5s</span>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="text-slate-400 border-b border-slate-700">
                    <tr>
                        <th class="text-left py-3">Biển số</th>
                        <th class="text-left py-3">Tài xế</th>
                        <th class="text-left py-3">Phiên</th>
                        <th class="text-left py-3">AI Status</th>
                        <th class="text-left py-3">Risk</th>
                        <th class="text-left py-3">Thời gian AI</th>
                    </tr>
                </thead>
                <tbody id="xe_live"></tbody>
            </table>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- AI ALERTS -->
        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <h2 class="text-xl font-bold mb-4">Cảnh báo AI mới nhất</h2>
            <div id="canh_bao_moi" class="space-y-3"></div>
        </div>

        <!-- DRIVER REPORTS -->
        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
            <h2 class="text-xl font-bold mb-4">Báo cáo tài xế mới nhất</h2>
            <div id="bao_cao_moi" class="space-y-3"></div>
        </div>

    </div>

</div>

<script>
function statusColor(status) {
    if (status === "BUON NGU") return "bg-red-500/20 text-red-300";
    if (status === "MET MOI") return "bg-yellow-500/20 text-yellow-300";
    if (status === "TINH TAO") return "bg-green-500/20 text-green-300";
    if (status === "CHO_XU_LY") return "bg-yellow-500/20 text-yellow-300";
    if (status === "DANG_XU_LY") return "bg-blue-500/20 text-blue-300";
    if (status === "DA_XU_LY") return "bg-green-500/20 text-green-300";
    return "bg-slate-700 text-slate-300";
}

async function loadDashboard() {
    const res = await fetch("/api/admin/dashboard");
    const json = await res.json();
    const data = json.data;

    document.getElementById("tong_tai_xe").innerText = data.tong_tai_xe;
    document.getElementById("tong_xe").innerText = data.tong_xe;
    document.getElementById("xe_dang_hoat_dong").innerText = data.xe_dang_hoat_dong;
    document.getElementById("canh_bao_hom_nay").innerText = data.canh_bao_hom_nay;
    document.getElementById("bao_cao_chua_xu_ly").innerText = data.bao_cao_chua_xu_ly;

    const liveBox = document.getElementById("xe_live");
    liveBox.innerHTML = "";

    if (data.xe_live.length === 0) {
        liveBox.innerHTML = `
            <tr>
                <td colspan="6" class="py-4 text-slate-400">
                    Chưa có xe đang hoạt động
                </td>
            </tr>
        `;
    } else {
        data.xe_live.forEach(item => {
            liveBox.innerHTML += `
                <tr class="border-b border-slate-800">
                    <td class="py-3">${item.bien_so || "N/A"}</td>
                    <td class="py-3">${item.ho_ten || "Chưa xác định"}</td>
                    <td class="py-3">${item.trang_thai_phien || "N/A"}</td>
                    <td class="py-3">
                        <span class="px-3 py-1 rounded-full ${statusColor(item.ai_status)}">
                            ${item.ai_status || "Chưa có"}
                        </span>
                    </td>
                    <td class="py-3">${item.risk_score || 0}</td>
                    <td class="py-3 text-slate-400">${item.thoi_gian || ""}</td>
                </tr>
            `;
        });
    }

    const alertBox = document.getElementById("canh_bao_moi");
    alertBox.innerHTML = "";

    if (data.canh_bao_moi.length === 0) {
        alertBox.innerHTML = `<p class="text-slate-400">Chưa có cảnh báo AI</p>`;
    } else {
        data.canh_bao_moi.forEach(item => {
            alertBox.innerHTML += `
                <div class="bg-slate-800 rounded-xl p-4">
                    <div class="flex justify-between">
                        <div>
                            <h3 class="font-bold">${item.ho_ten || "Chưa xác định"}</h3>
                            <p class="text-slate-400 text-sm">${item.bien_so || "N/A"}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-sm ${statusColor(item.trang_thai)}">
                            ${item.trang_thai}
                        </span>
                    </div>
                    <p class="text-sm mt-2">Risk: ${item.risk_score} | EAR: ${item.ear} | MAR: ${item.mar}</p>
                    <p class="text-xs text-slate-500 mt-1">${item.thoi_gian}</p>
                </div>
            `;
        });
    }

    const reportBox = document.getElementById("bao_cao_moi");
    reportBox.innerHTML = "";

    if (data.bao_cao_moi.length === 0) {
        reportBox.innerHTML = `<p class="text-slate-400">Chưa có báo cáo tài xế</p>`;
    } else {
        data.bao_cao_moi.forEach(item => {
            reportBox.innerHTML += `
                <div class="bg-slate-800 rounded-xl p-4">
                    <div class="flex justify-between">
                        <div>
                            <h3 class="font-bold">${item.tieu_de}</h3>
                            <p class="text-slate-400 text-sm">${item.ho_ten || "Tài xế ID " + item.tai_xe_id}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-sm ${statusColor(item.trang_thai)}">
                            ${item.trang_thai}
                        </span>
                    </div>
                    <p class="text-sm mt-2">${item.loai_su_co} - ${item.bien_so || "N/A"}</p>
                    <p class="text-xs text-slate-500 mt-1">${item.created_at}</p>
                </div>
            `;
        });
    }
}

loadDashboard();
setInterval(loadDashboard, 5000);
</script>

</body>
</html>
