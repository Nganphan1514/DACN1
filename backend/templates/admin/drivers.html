<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tài xế</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen p-6">

<div class="max-w-7xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold">Quản lý tài xế</h1>
            <p class="text-slate-400">Cập nhật thông tin và gửi thông báo cho tài xế</p>
        </div>

        <a href="/admin/dashboard" class="bg-slate-800 px-4 py-2 rounded-xl">
            Dashboard
        </a>
    </div>

    <div id="drivers" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

</div>

<script>
async function loadDrivers() {
    const res = await fetch("/api/admin/drivers");
    const json = await res.json();

    const box = document.getElementById("drivers");
    box.innerHTML = "";

    json.data.forEach(item => {
        box.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">${item.ho_ten}</h2>
                        <p class="text-slate-400 text-sm">ID: ${item.id}</p>
                    </div>

                    <span class="px-3 py-1 rounded-full text-sm bg-blue-500/20 text-blue-300">
                        ${item.trang_thai || "N/A"}
                    </span>
                </div>

                <div class="space-y-3">
                    <input id="ho_ten-${item.id}" value="${item.ho_ten || ""}"
                        class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700"
                        placeholder="Họ tên">

                    <input id="sdt-${item.id}" value="${item.so_dien_thoai || ""}"
                        class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700"
                        placeholder="Số điện thoại">

                    <input id="gplx-${item.id}" value="${item.so_gplx || ""}"
                        class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700"
                        placeholder="Số GPLX">

                    <input id="dia_chi-${item.id}" value="${item.dia_chi || ""}"
                        class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700"
                        placeholder="Địa chỉ">

                    <select id="trang_thai-${item.id}"
                        class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700">
                        <option value="hoat_dong" ${item.trang_thai === "hoat_dong" ? "selected" : ""}>Hoạt động</option>
                        <option value="tam_ngung" ${item.trang_thai === "tam_ngung" ? "selected" : ""}>Tạm ngưng</option>
                    </select>

                    <button onclick="updateDriver(${item.id})"
                        class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-semibold">
                        Lưu thay đổi
                    </button>
                </div>
            </div>
        `;
    });
}

async function updateDriver(id) {
    const body = {
        ho_ten: document.getElementById(`ho_ten-${id}`).value,
        so_dien_thoai: document.getElementById(`sdt-${id}`).value,
        so_gplx: document.getElementById(`gplx-${id}`).value,
        dia_chi: document.getElementById(`dia_chi-${id}`).value,
        trang_thai: document.getElementById(`trang_thai-${id}`).value,
        quan_ly_id: 1
    };

    const res = await fetch(`/api/admin/drivers/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    const json = await res.json();

    alert(json.message);

    loadDrivers();
}

loadDrivers();
</script>

</body>
</html>
