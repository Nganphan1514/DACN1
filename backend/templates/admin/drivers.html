<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài xế</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<nav class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div>
                <h1 class="text-xl font-bold">DACN1 Admin</h1>
                <p class="text-sm text-slate-400">Hệ thống giám sát tài xế bằng AI</p>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-1">
                <a href="/admin/dashboard" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Dashboard</a>
                <a href="/admin/drivers" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Tài xế</a>
                <a href="/admin/vehicles" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Xe</a>
                <a href="/admin/scheduler" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Lịch chạy</a>
                <a href="/admin/reports" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Báo cáo</a>
                <a href="/admin/analytics" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Thống kê</a>
                <a href="/logout" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-sm whitespace-nowrap">Đăng xuất</a>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6">

    <div class="mb-6">
        <h1 class="text-3xl font-black">Quản lý tài xế</h1>
        <p class="text-slate-400 mt-1">Cập nhật hồ sơ tài xế và tự động gửi thông báo khi có thay đổi</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">👨‍✈️ Tổng tài xế</p>
            <h2 id="totalDrivers" class="text-4xl font-black mt-2">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🟢 Đang hoạt động</p>
            <h2 id="activeDrivers" class="text-4xl font-black mt-2 text-green-400">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🔴 Tạm ngưng</p>
            <h2 id="inactiveDrivers" class="text-4xl font-black mt-2 text-red-400">0</h2>
        </div>
    </div>

    <div class="mb-6">
        <input
            id="searchDriver"
            onkeyup="filterDrivers()"
            placeholder="🔍 Tìm theo tên, số điện thoại, GPLX..."
            class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>

    <div id="drivers" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

</main>

<script>
const currentPath = window.location.pathname;

document.querySelectorAll(".admin-link").forEach(link => {
    if (link.getAttribute("href") === currentPath) {
        link.classList.remove("bg-slate-800");
        link.classList.add("bg-blue-600");
    }
});

function statusBadge(status) {
    if (status === "hoat_dong") {
        return "bg-green-500/20 text-green-300 border border-green-500/30";
    }

    if (status === "tam_ngung") {
        return "bg-red-500/20 text-red-300 border border-red-500/30";
    }

    return "bg-slate-700 text-slate-300 border border-slate-600";
}

function statusText(status) {
    if (status === "hoat_dong") return "Hoạt động";
    if (status === "tam_ngung") return "Tạm ngưng";
    return status || "N/A";
}

async function loadDrivers() {
    const res = await fetch("/api/admin/drivers");
    const json = await res.json();

    const data = json.data || [];
    const box = document.getElementById("drivers");

    document.getElementById("totalDrivers").innerText = data.length;
    document.getElementById("activeDrivers").innerText = data.filter(x => x.trang_thai === "hoat_dong").length;
    document.getElementById("inactiveDrivers").innerText = data.filter(x => x.trang_thai === "tam_ngung").length;

    box.innerHTML = "";

    if (data.length === 0) {
        box.innerHTML = `
            <div class="md:col-span-2 bg-slate-900 p-6 rounded-3xl border border-slate-800 text-slate-400">
                Chưa có tài xế nào.
            </div>
        `;
        return;
    }

    data.forEach(item => {
        const firstLetter = item.ho_ten ? item.ho_ten.charAt(0).toUpperCase() : "T";

        box.innerHTML += `
            <div class="driver-card bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl hover:border-blue-500/40 transition">
                <div class="flex justify-between items-start gap-4 mb-5">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-2xl font-black shadow-lg">
                            ${firstLetter}
                        </div>

                        <div>
                            <h2 class="driver-name text-xl font-bold">${item.ho_ten || "Chưa có tên"}</h2>
                            <p class="text-slate-400 text-sm">ID: ${item.id}</p>
                        </div>
                    </div>

                    <span class="px-3 py-1 rounded-full text-xs font-bold ${statusBadge(item.trang_thai)}">
                        ${statusText(item.trang_thai)}
                    </span>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Họ tên</label>
                        <input id="ho_ten-${item.id}" value="${item.ho_ten || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="Họ tên">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Số điện thoại</label>
                        <input id="sdt-${item.id}" value="${item.so_dien_thoai || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="Số điện thoại">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Số GPLX</label>
                        <input id="gplx-${item.id}" value="${item.so_gplx || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="Số GPLX">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Địa chỉ</label>
                        <input id="dia_chi-${item.id}" value="${item.dia_chi || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="Địa chỉ">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Trạng thái</label>
                        <select id="trang_thai-${item.id}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500">
                            <option value="hoat_dong" ${item.trang_thai === "hoat_dong" ? "selected" : ""}>Hoạt động</option>
                            <option value="tam_ngung" ${item.trang_thai === "tam_ngung" ? "selected" : ""}>Tạm ngưng</option>
                        </select>
                    </div>

                    <button id="btn-${item.id}" onclick="updateDriver(${item.id})"
                        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] transition p-3 rounded-xl font-bold">
                        Lưu thay đổi
                    </button>
                </div>
            </div>
        `;
    });
}

async function updateDriver(id) {
    const btn = document.getElementById(`btn-${id}`);
    btn.innerText = "Đang lưu...";
    btn.disabled = true;
    btn.classList.add("opacity-70");

    try {
        const body = {
            ho_ten: document.getElementById(`ho_ten-${id}`).value,
            so_dien_thoai: document.getElementById(`sdt-${id}`).value,
            so_gplx: document.getElementById(`gplx-${id}`).value,
            dia_chi: document.getElementById(`dia_chi-${id}`).value,
            trang_thai: document.getElementById(`trang_thai-${id}`).value,
            quan_ly_id: 1
        };

        const res = await fetch(`/api/admin/drivers/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });

        const json = await res.json();
        alert(json.message);
        loadDrivers();

    } catch (error) {
        alert("Không thể cập nhật tài xế.");
    } finally {
        btn.innerText = "Lưu thay đổi";
        btn.disabled = false;
        btn.classList.remove("opacity-70");
    }
}

function filterDrivers() {
    const keyword = document.getElementById("searchDriver").value.toLowerCase();

    document.querySelectorAll(".driver-card").forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(keyword) ? "block" : "none";
    });
}

loadDrivers();
</script>

</body>
</html>
