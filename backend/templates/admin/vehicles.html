<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<nav class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div>
                <h1 class="text-xl font-bold">DACN1 Admin</h1>
                <p class="text-sm text-slate-400">Hệ thống giám sát tài xế bằng AI</p>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-1">
                <a href="/admin/dashboard" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Dashboard</a>
                <a href="/admin/drivers" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Tài xế</a>
                <a href="/admin/vehicles" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Xe</a>
                <a href="/admin/scheduler" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Lịch chạy</a>
                <a href="/admin/reports" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Báo cáo</a>
                <a href="/admin/analytics" class="admin-link px-4 py-2 rounded-xl bg-slate-800 hover:bg-blue-600 text-sm whitespace-nowrap">Thống kê</a>
                <a href="/logout" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-sm whitespace-nowrap">Đăng xuất</a>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6">

    <div class="mb-6">
        <h1 class="text-3xl font-black">Quản lý xe</h1>
        <p class="text-slate-400 mt-1">Cập nhật thông tin xe, trạng thái hoạt động và tài xế mặc định</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🚛 Tổng xe</p>
            <h2 id="totalVehicles" class="text-4xl font-black mt-2">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🟢 Hoạt động</p>
            <h2 id="activeVehicles" class="text-4xl font-black mt-2 text-green-400">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🛠️ Bảo trì</p>
            <h2 id="maintenanceVehicles" class="text-4xl font-black mt-2 text-yellow-400">0</h2>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
            <p class="text-slate-400 text-sm">🔴 Ngưng hoạt động</p>
            <h2 id="inactiveVehicles" class="text-4xl font-black mt-2 text-red-400">0</h2>
        </div>
    </div>

    <div class="mb-6">
        <input
            id="searchVehicle"
            onkeyup="filterVehicles()"
            placeholder="🔍 Tìm theo biển số, model, tài xế..."
            class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>

    <div id="vehicles" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

</main>

<script>
const currentPath = window.location.pathname;

document.querySelectorAll(".admin-link").forEach(link => {
    if (link.getAttribute("href") === currentPath) {
        link.classList.remove("bg-slate-800");
        link.classList.add("bg-blue-600");
    }
});

function statusBadge(status) {
    if (status === "hoat_dong") {
        return "bg-green-500/20 text-green-300 border border-green-500/30";
    }

    if (status === "bao_tri") {
        return "bg-yellow-500/20 text-yellow-300 border border-yellow-500/30";
    }

    if (status === "ngung_hoat_dong") {
        return "bg-red-500/20 text-red-300 border border-red-500/30";
    }

    return "bg-slate-700 text-slate-300 border border-slate-600";
}

function statusText(status) {
    if (status === "hoat_dong") return "Hoạt động";
    if (status === "bao_tri") return "Bảo trì";
    if (status === "ngung_hoat_dong") return "Ngưng hoạt động";
    return status || "N/A";
}

async function loadVehicles() {
    const res = await fetch("/api/admin/vehicles");
    const json = await res.json();

    const data = json.data || [];
    const box = document.getElementById("vehicles");

    document.getElementById("totalVehicles").innerText = data.length;
    document.getElementById("activeVehicles").innerText = data.filter(x => x.trang_thai === "hoat_dong").length;
    document.getElementById("maintenanceVehicles").innerText = data.filter(x => x.trang_thai === "bao_tri").length;
    document.getElementById("inactiveVehicles").innerText = data.filter(x => x.trang_thai === "ngung_hoat_dong").length;

    box.innerHTML = "";

    if (data.length === 0) {
        box.innerHTML = `
            <div class="md:col-span-2 bg-slate-900 p-6 rounded-3xl border border-slate-800 text-slate-400">
                Chưa có xe nào.
            </div>
        `;
        return;
    }

    data.forEach(item => {
        box.innerHTML += `
            <div class="vehicle-card bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl hover:border-blue-500/40 transition">
                <div class="flex justify-between items-start gap-4 mb-5">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-green-600 flex items-center justify-center text-2xl shadow-lg">
                            🚛
                        </div>

                        <div>
                            <h2 class="text-2xl font-black font-mono">${item.bien_so || "N/A"}</h2>
                            <p class="text-slate-400 text-sm">${item.model || "Chưa có model"}</p>
                        </div>
                    </div>

                    <span class="px-3 py-1 rounded-full text-xs font-bold ${statusBadge(item.trang_thai)}">
                        ${statusText(item.trang_thai)}
                    </span>
                </div>

                <div class="mb-4 bg-slate-800/60 rounded-2xl p-4 border border-slate-700">
                    <p class="text-xs text-slate-400 uppercase font-bold">Tài xế mặc định</p>
                    <p class="font-bold mt-1">${item.ten_tai_xe_mac_dinh || "Chưa gán"}</p>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Biển số</label>
                        <input id="bien_so-${item.id}" value="${item.bien_so || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="Biển số">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Model</label>
                        <input id="model-${item.id}" value="${item.model || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="Model">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">ID tài xế mặc định</label>
                        <input id="tai_xe-${item.id}" value="${item.tai_xe_mac_dinh_id || ""}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                            placeholder="VD: 1">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 font-bold uppercase">Trạng thái</label>
                        <select id="trang_thai-${item.id}"
                            class="w-full mt-1 p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500">
                            <option value="hoat_dong" ${item.trang_thai === "hoat_dong" ? "selected" : ""}>Hoạt động</option>
                            <option value="bao_tri" ${item.trang_thai === "bao_tri" ? "selected" : ""}>Bảo trì</option>
                            <option value="ngung_hoat_dong" ${item.trang_thai === "ngung_hoat_dong" ? "selected" : ""}>Ngưng hoạt động</option>
                        </select>
                    </div>

                    <button id="btn-${item.id}" onclick="updateVehicle(${item.id})"
                        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] transition p-3 rounded-xl font-bold">
                        Lưu thay đổi
                    </button>
                </div>
            </div>
        `;
    });
}

async function updateVehicle(id) {
    const btn = document.getElementById(`btn-${id}`);
    btn.innerText = "Đang lưu...";
    btn.disabled = true;
    btn.classList.add("opacity-70");

    try {
        const taiXeValue = document.getElementById(`tai_xe-${id}`).value;

        const body = {
            bien_so: document.getElementById(`bien_so-${id}`).value,
            model: document.getElementById(`model-${id}`).value,
            trang_thai: document.getElementById(`trang_thai-${id}`).value,
            tai_xe_mac_dinh_id: taiXeValue ? Number(taiXeValue) : null
        };

        const res = await fetch(`/api/admin/vehicles/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });

        const json = await res.json();
        alert(json.message);
        loadVehicles();

    } catch (error) {
        alert("Không thể cập nhật xe.");
    } finally {
        btn.innerText = "Lưu thay đổi";
        btn.disabled = false;
        btn.classList.remove("opacity-70");
    }
}

function filterVehicles() {
    const keyword = document.getElementById("searchVehicle").value.toLowerCase();

    document.querySelectorAll(".vehicle-card").forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(keyword) ? "block" : "none";
    });
}

loadVehicles();
</script>

</body>
</html>
