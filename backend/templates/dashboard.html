<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Hệ Thống Giám Sát Tài Xế
    </title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background:
                linear-gradient(135deg,
                    #0f172a,
                    #1e293b);

            color: white;

            font-family:
                Arial,
                sans-serif;

            min-height: 100vh;

            padding: 25px;
        }

        h1 {

            text-align: center;

            margin-bottom: 25px;

            font-size: 40px;
        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(420px,
                        1fr));

            gap: 20px;
        }

        .card {

            background:
                rgba(255,
                    255,
                    255,
                    0.08);

            backdrop-filter:
                blur(20px);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.08);

            border-radius: 30px;

            padding: 25px;

            box-shadow:
                0 8px 32px rgba(0,
                    0,
                    0,
                    0.3);
        }

        .card h2 {

            margin-bottom: 20px;
        }

        .status {

            font-size: 42px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .status-green {
            color: #00ff88;
        }

        .status-orange {
            color: #ffb020;
        }

        .status-red {
            color: #ff4d4d;
        }

        .info-box p {

            margin-bottom: 10px;

            font-size: 18px;
        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .stat-item {

            background:
                rgba(255,
                    255,
                    255,
                    0.06);

            border-radius: 20px;

            padding: 20px;

            text-align: center;
        }

        .stat-item h3 {

            font-size: 18px;

            margin-bottom: 10px;
        }

        .stat-item h2 {

            font-size: 35px;
        }

        table {

            width: 100%;

            border-collapse:
                collapse;
        }

        th,
        td {

            padding: 12px;

            text-align: center;

            border-bottom:
                1px solid rgba(255,
                    255,
                    255,
                    0.1);
        }

        th {
            color: #93c5fd;
        }

        canvas {
            height: 300px !important;
        }

        .snapshot-grid {

            display: flex;

            gap: 15px;

            overflow-x: auto;
        }

        .snapshot-grid img {

            width: 220px;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.3s;

            border:
                2px solid rgba(255,
                    255,
                    255,
                    0.1);
        }

        .snapshot-grid img:hover {

            transform:
                scale(1.05);
        }

        #preview {

            position: fixed;

            inset: 0;

            background:
                rgba(0,
                    0,
                    0,
                    0.8);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 999;
        }

        #preview img {

            width: 70%;

            border-radius: 25px;
        }
    </style>

</head>

<body>

    <h1>
        🚗 Hệ Thống Giám Sát Tài Xế
    </h1>

    <div class="grid">

        <!-- STATUS -->
        <div class="card">

            <h2>
                Trạng Thái Realtime
            </h2>

            <div id="status" class="status">
                Loading...
            </div>

            <div class="info-box">

                <p id="risk">
                    Risk Score:
                </p>

                <p id="ear">
                    EAR:
                </p>

                <p id="mar">
                    MAR:
                </p>

            </div>

        </div>

        <!-- STATS -->
        <div class="card">

            <h2>
                Thống Kê Hôm Nay
            </h2>

            <div class="stats">

                <div class="stat-item">

                    <h3>
                        Tổng Log
                    </h3>

                    <h2 id="totalLogs">
                        0
                    </h2>

                </div>

                <div class="stat-item">

                    <h3>
                        Buồn Ngủ
                    </h3>

                    <h2 id="sleepyCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- CHART -->
        <div class="card">

            <h2>
                Biểu Đồ Risk Score
            </h2>

            <canvas id="riskChart"></canvas>

        </div>

        <!-- DRIVER -->
        <div class="card">

            <h2>
                Quản Lý Tài Xế
            </h2>

            <table>

                <thead>

                    <tr>
                        <th>Họ tên</th>
                        <th>SĐT</th>
                        <th>GPLX</th>
                        <th>Trạng thái</th>
                    </tr>

                </thead>

                <tbody id="driversTable"></tbody>

            </table>

        </div>

        <!-- VEHICLE -->
        <div class="card">

            <h2>
                Quản Lý Xe
            </h2>

            <table>

                <thead>

                    <tr>
                        <th>Biển số</th>
                        <th>Model</th>
                        <th>Trạng thái</th>
                    </tr>

                </thead>

                <tbody id="vehiclesTable"></tbody>

            </table>

        </div>

        <!-- HISTORY -->
        <div class="card">

            <h2>
                Lịch Sử AI
            </h2>

            <table>

                <thead>

                    <tr>
                        <th>Thời gian</th>
                        <th>Trạng thái</th>
                        <th>Risk</th>
                    </tr>

                </thead>

                <tbody id="history"></tbody>

            </table>

        </div>

        <!-- SNAPSHOT -->
        <div class="card">

            <h2>
                Ảnh Cảnh Báo
            </h2>

            <div id="snapshots" class="snapshot-grid"></div>

        </div>

    </div>

    <div id="preview">

        <img id="previewImage">

    </div>

    <script>

        let chart

        async function loadData() {

            const statusRes =
                await fetch("/api/status")

            const statusData =
                await statusRes.json()

            const status =
                document.getElementById(
                    "status"
                )

            status.innerText =
                statusData.trang_thai

            status.className =
                "status"

            if (
                statusData.trang_thai
                === "TINH TAO"
            ) {

                status.classList.add(
                    "status-green"
                )

            }
            else if (
                statusData.trang_thai
                === "MET MOI"
            ) {

                status.classList.add(
                    "status-orange"
                )

            }
            else {

                status.classList.add(
                    "status-red"
                )

            }

            document
                .getElementById(
                    "risk"
                )
                .innerText =
                "Risk Score: " +
                statusData.risk_score

            document
                .getElementById(
                    "ear"
                )
                .innerText =
                "EAR: " +
                statusData.ear

            document
                .getElementById(
                    "mar"
                )
                .innerText =
                "MAR: " +
                statusData.mar

            const logs =
                await (
                    await fetch(
                        "/api/logs"
                    )
                ).json()

            const history =
                document.getElementById(
                    "history"
                )

            history.innerHTML = ""

            logs
                .slice(0, 10)
                .forEach(log => {

                    history.innerHTML += `
            <tr>
                <td>${log.thoi_gian}</td>
                <td>${log.trang_thai}</td>
                <td>${log.risk_score}</td>
            </tr>
            `
                })

            const stats =
                await (
                    await fetch(
                        "/api/stats"
                    )
                ).json()

            document
                .getElementById(
                    "totalLogs"
                )
                .innerText =
                stats.total

            document
                .getElementById(
                    "sleepyCount"
                )
                .innerText =
                stats.sleepy_count

            const labels =
                logs
                    .slice(0, 20)
                    .reverse()
                    .map(x => x.id)

            const values =
                logs
                    .slice(0, 20)
                    .reverse()
                    .map(x => x.risk_score)

            if (chart) {

                chart.destroy()
            }

            chart =
                new Chart(
                    document
                        .getElementById(
                            "riskChart"
                        ),
                    {
                        type: "line",
                        data: {
                            labels,
                            datasets: [
                                {
                                    label:
                                        "Risk Score",
                                    data: values,
                                    borderWidth: 3
                                }]
                        }
                    }
                )
        }

        setInterval(
            loadData,
            2000
        )

        loadData()

    </script>

</body>

</html>
