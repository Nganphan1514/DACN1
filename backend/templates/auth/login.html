<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập hệ thống</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );
        }

        .glass-card {
            backdrop-filter: blur(20px);
            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            box-shadow:
                0 10px 40px rgba(
                    0,
                    0,
                    0,
                    0.4
                );
        }

        .input-box {
            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            color: white;
        }

        .input-box:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow:
                0 0 15px
                rgba(34,197,94,.4);
        }
    </style>
</head>

<body
    class="
    min-h-screen
    flex
    justify-center
    items-center
    px-4
">

    <div
        class="
        glass-card
        w-full
        max-w-md
        rounded-3xl
        p-8
    ">

        <!-- Logo -->
        <div class="text-center mb-8">

            <h1
                class="
                text-3xl
                font-bold
                text-white
            ">
                Driver Monitoring
            </h1>

            <p
                class="
                text-slate-300
                mt-2
            ">
                Hệ thống giám sát tài xế AI
            </p>

        </div>

        <!-- Form -->
        <div class="space-y-5">

            <div>

                <label
                    class="
                    text-slate-300
                    block
                    mb-2
                ">
                    Tên đăng nhập
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Nhập tài khoản"
                    class="
                    input-box
                    w-full
                    rounded-xl
                    px-4
                    py-3
                "
                >

            </div>

            <div>

                <label
                    class="
                    text-slate-300
                    block
                    mb-2
                ">
                    Mật khẩu
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Nhập mật khẩu"
                    class="
                    input-box
                    w-full
                    rounded-xl
                    px-4
                    py-3
                "
                >

            </div>

            <button
                onclick="login()"
                class="
                w-full
                bg-green-500
                hover:bg-green-600
                transition
                text-white
                font-semibold
                py-3
                rounded-xl
                shadow-lg
            ">
                Đăng nhập
            </button>

        </div>

        <!-- Error -->
        <p
            id="errorMessage"
            class="
            text-red-400
            text-center
            mt-5
        ">
        </p>

    </div>

    <script>

        async function login() {

            const username =
                document
                .getElementById(
                    "username"
                )
                .value

            const password =
                document
                .getElementById(
                    "password"
                )
                .value

            const response =
                await fetch(
                    "/api/login",
                    {
                        method:
                        "POST",

                        headers:
                        {
                            "Content-Type":
                            "application/json"
                        },

                        body:
                        JSON.stringify({
                            username,
                            password
                        })
                    }
                )

            const data =
                await response.json()

            // login fail
            if (!data.success) {

                document
                .getElementById(
                    "errorMessage"
                )
                .innerText =
                data.message

                return
            }

            // save token
            localStorage.setItem(
                "token",
                data.token
            )

            localStorage.setItem(
                "role",
                data.role
            )

            // redirect
            if (
                data.role
                === "quan_ly"
            ) {

                window.location.href =
                    "/admin/dashboard"
            }

            else {

                fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({

                        username:
                            username,

                        password:
                            password
                    })
                })
                    .then(res => res.json())
                    .then(data => {

                        if (data.success) {

                            window.location.href =
                                data.redirect

                        } else {

                            alert(
                                data.message
                            )
                        }
                    })
            }
        }

    </script>

</body>
</html>
