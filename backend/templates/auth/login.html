<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập DACN1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center text-white">

<div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold mb-2 text-center">DACN1</h1>
    <p class="text-slate-400 text-center mb-6">Hệ thống giám sát tài xế</p>

    <div class="space-y-4">
        <input id="username"
               class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700"
               placeholder="Tên đăng nhập">

        <input id="password"
               type="password"
               class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700"
               placeholder="Mật khẩu">

        <button onclick="login()"
                class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-semibold">
            Đăng nhập
        </button>

        <p id="message" class="text-center text-red-400"></p>
    </div>
</div>

<script>
async function login() {
    const ten_dang_nhap = document.getElementById("username").value;
    const mat_khau = document.getElementById("password").value;

    const res = await fetch("/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            ten_dang_nhap,
            mat_khau
        })
    });

    const data = await res.json();

    if (!data.success) {
        document.getElementById("message").innerText = data.message;
        return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));

    if (data.user.vai_tro === "quan_ly") {
        window.location.href = "/admin/dashboard";
    } else {
        window.location.href = "/driver/dashboard";
    }
}
</script>

</body>
</html>
