<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5D7B6F">
    <title>Đăng nhập · Sleep Alert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
</head>
<body class="ds-body">
<div class="ds-login">
    <div class="ds-blob ds-blob--a" aria-hidden="true"></div>
    <div class="ds-blob ds-blob--b" aria-hidden="true"></div>
    <main class="ds-login__main">
        <section>
            <svg class="ds-login__logo" viewBox="0 0 48 48" aria-hidden="true"><g class="ds-logo__eye"><path d="M3 24C9 13 17 9 24 9s15 4 21 15c-6 11-14 15-21 15S9 35 3 24z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="7" fill="currentColor"/></g></svg>
            <h1 class="ds-login__title">Sleep Alert</h1>
            <p class="ds-login__lead">Giám sát tài xế và cảnh báo buồn ngủ bằng AI cho đội xe của bạn.</p>
        </section>

        <section class="ds-login__card" aria-labelledby="login-title">
            <h2 id="login-title" class="ds-display">Đăng nhập</h2>
            <p>Dùng tài khoản được cấp để quản lý đội xe và tài xế.</p>

            <noscript><p>Hãy bật JavaScript để đăng nhập.</p></noscript>
            <form id="loginForm" method="post" novalidate>
                <div class="ds-field">
                    <label class="ds-field__label" for="username">Tên đăng nhập</label>
                    <input id="username" name="username" class="ds-input" type="text"
                           placeholder="Nhập tên đăng nhập" autocomplete="username"
                           autocapitalize="none" spellcheck="false" autofocus required>
                </div>

                <div class="ds-field">
                    <label class="ds-field__label" for="password">Mật khẩu</label>
                    <div class="ds-field__row">
                        <input id="password" name="password" class="ds-input" type="password"
                               placeholder="Nhập mật khẩu" autocomplete="current-password"
                               required>
                        <button id="togglePassword" class="ds-field__toggle" type="button"
                                aria-controls="password" aria-pressed="false">Hiện</button>
                    </div>
                </div>

                <button id="loginBtn" class="ds-btn ds-btn--primary ds-btn--block" type="submit">Đăng nhập</button>

                <p id="message" class="ds-form-msg" role="alert" aria-live="assertive"></p>
            </form>
        </section>
    </main>

</div>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
